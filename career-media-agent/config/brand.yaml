brand:
  name: 逆転キャリア研究所
  mission: 学歴や経歴に自信がなくても、転職でキャリアを再設計できることを一次体験と事実ベースで伝える
  audience:
    primary:
      - 20代後半〜30代
      - 地方企業・中小企業・営業職から転職したい人
      - 学歴や職歴に自信がない人
      - 年収400〜600万円帯でキャリアアップを考える人
    secondary:
      - 第二新卒・若手層
      - ブランクやキャリア断絶後に再就職を目指す人
  tone:
    - 具体的
    - 率直
    - 再現可能
    - 誇張しない
    - 上から目線にしない
  content_pillars:
    - 地方企業からの転職
    - 営業職のキャリアアップ
    - 転職エージェント活用
    - 面接と職務経歴書
    - 年収と求人票
    - ブランクからの再起
  cta_keywords:
    職歴: 職務経歴書の考え方
    面接: 面接対策
    年収: 年収・求人票の読み方
    転職: 転職サービス比較
    求人: 求人票チェック
