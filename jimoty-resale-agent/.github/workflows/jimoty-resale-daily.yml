name: Jimoty resale daily report
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 JST (UTC+9)
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: 'Commit generated report/state'
        required: false
        default: 'false'
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jimoty-resale-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m src.main --mode manual_import --input examples/listings.json
      - uses: actions/upload-artifact@v4
        with:
          name: jimoty-resale-report
          path: jimoty-resale-agent/reports/*.md
      - name: Optionally commit generated outputs
        if: github.event_name == 'workflow_dispatch' && inputs.commit_outputs == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports data/state.db
          git diff --cached --quiet || git commit -m "chore: update Jimoty resale report"
          git push
